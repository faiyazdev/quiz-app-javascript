<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Master</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>

  <body>
    <div class="quiz-container">
      <div class="header">
        <h1>🧠 Quiz Master</h1>
        <p>
          Test your frontend knowledge by selecting the correct answer. Choose
          one option and continue to the next question.
        </p>
      </div>

      <div class="progress">
        <span>Question 1 of 5</span>

        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>

      <div class="question-card">
        <h2>Which HTML element is used to create a hyperlink?</h2>
      </div>

      <div class="options">
        <label class="option">
          <input type="radio" name="answer" />
          <span>&lt;link&gt;</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" />
          <span>&lt;a&gt;</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" />
          <span>&lt;href&gt;</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" />
          <span>&lt;url&gt;</span>
        </label>
      </div>

      <div class="actions">
        <button class="next-btn">Next →</button>
      </div>
    </div>
  </body>
</html>
