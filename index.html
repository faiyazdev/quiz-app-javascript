<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Master</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>

  <body>
    <div class="quiz-container">
      <div class="header">
        <h1>🧠 Quiz Master</h1>
        <p>
          Test your frontend knowledge by selecting the correct answer. Choose
          one option and continue to the next question.
        </p>
      </div>

      <div class="progress">
        <span></span>

        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>

      <div class="question-card">
        <h2>Which HTML element is used to create a hyperlink?</h2>
        <span></span>
      </div>

      <div class="options"></div>

      <div class="actions">
        <button class="next-btn">Next →</button>
      </div>
    </div>
  </body>
</html>
